<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>电商文案智能体</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>电商文案智能体</h1>
  </header>
  <main class="main-grid">
    <section class="form-panel">
      <div class="form-card">
        <div class="form-group">
          <label for="authToken">Token</label>
          <input type="text" id="authToken" placeholder="输入 API Token">
        </div>
        <div class="form-group">
          <label for="category">品类</label>
          <input type="text" id="category" placeholder="如：美妆、数码、食品">
        </div>
        <div class="form-group">
          <label for="title">标题</label>
          <input type="text" id="title" placeholder="产品标题">
        </div>
        <div class="form-group">
          <label for="sellingPoints">关键词 / 卖点</label>
          <div class="keyword-mode" role="radiogroup" aria-label="关键词模式">
            <label class="keyword-mode-option">
              <input type="radio" name="keywordMode" value="text" checked>
              <span>文字</span>
            </label>
            <label class="keyword-mode-option">
              <input type="radio" name="keywordMode" value="image">
              <span>图片</span>
            </label>
          </div>
          <div id="textKeywordPanel">
            <input type="text" id="sellingPoints" placeholder="卖点用逗号分隔，如：补水, 锁水">
          </div>
          <div id="imageKeywordPanel" class="image-keyword-panel hidden">
            <input type="file" id="keywordImages" accept="image/jpeg,image/png,image/webp" multiple>
            <div id="imageUploadHint" class="image-upload-hint">最多 6 张，单张不超过 8MB，支持 JPG / PNG / WebP</div>
            <div id="imageFileList" class="image-file-list"></div>
          </div>
        </div>
        <div class="form-group">
          <label for="duration">时长（秒）</label>
          <input type="number" id="duration" value="30" min="15" max="180">
        </div>
        <div class="form-group">
          <label for="platform">平台</label>
          <select id="platform">
            <option value="抖音">抖音</option>
            <option value="淘宝">淘宝</option>
            <option value="小红书">小红书</option>
            <option value="TikTok">TikTok</option>
            <option value="Amazon">Amazon</option>
          </select>
        </div>
        <div class="form-group">
          <label for="tone">风格</label>
          <select id="tone">
            <option value="简洁">简洁</option>
            <option value="热情">热情</option>
            <option value="幽默">幽默</option>
            <option value="温情">温情</option>
            <option value="热血">热血</option>
          </select>
        </div>
        <div class="form-group">
          <label for="language">语言</label>
          <select id="language">
            <option value="zh">简体中文（zh）</option>
            <option value="en">English（en）</option>
            <option value="ja">日本語（ja）</option>
            <option value="ko">한국어（ko）</option>
            <option value="th">ไทย (th)</option>
            <option value="vi">Tiếng Việt (vi)</option>
            <option value="id">Bahasa Indonesia (id)</option>
            <option value="ms">Bahasa Melayu (ms)</option>
            <option value="fil">Filipino (fil)</option>
            <option value="my">မြန်မာဘာသာ (my)</option>
            <option value="km">ភាសាខ្មែរ (km)</option>
            <option value="lo">ລາວ (lo)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="voice">声音</label>
          <select id="voice"></select>
        </div>
        <button type="submit" class="btn-submit" id="submitBtn">生成文案</button>
      </div>
    </section>
    <section class="result-panel">
      <div id="loadingSpinner" class="loading-spinner hidden">
        <div class="spinner"></div>
      </div>
      <div id="resultSection" class="result-section hidden">
        <div class="result-card">
          <div class="section-title">生成文案</div>
          <div id="copyTitle" class="copy-title"></div>
          <div id="copyTags" class="copy-tags"></div>
          <div id="copyText" class="copy-text"></div>
        </div>
        <div class="result-card">
          <div class="section-title">统计信息</div>
          <div id="metaInfo" class="meta-info"></div>
          <div id="imageKeywordInfo" class="image-keyword-info"></div>
        </div>
        <div class="result-card">
          <div class="section-title">音频播放</div>
          <audio id="audioPlayer" class="audio-player" controls></audio>
        </div>
        <div class="result-card">
          <div class="section-title">当前字幕</div>
          <div id="subtitleOverlay" class="subtitle-overlay"></div>
        </div>
        <div class="result-card">
          <div class="section-title">字幕列表</div>
          <div id="subtitleList" class="subtitle-list"></div>
        </div>
      </div>
    </section>
  </main>
  <script src="app.js?v=2"></script>
</body>
</html>
